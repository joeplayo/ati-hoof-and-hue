function build(){history=[];running=false;frame=0;let bg=scene===2?rect(17,108,63,132,'wall')+rect(280,108,63,132,'wall')+path('M80 240V140Q180 35 280 140V240Z','wall')+path('M132 240V151Q180 95 228 151V240Z','sky'):scene===1?path('M17 205Q105 118 210 191Q283 233 343 164V373H17Z','dune')+path('M17 255Q100 280 200 207Q276 160 343 226V373H17Z','hill')+path('M17 310Q140 220 240 292Q300 330 343 280V373H17Z','ground'):path('M17 230Q65 110 121 200Q178 80 235 196Q290 122 343 200V373H17Z','mountain')+path('M17 280Q90 220 170 271T343 254V373H17Z','hill');if(scene===3)bg+=rect(17,228,326,28,'wall')+rect(25,218,310,10,'trim')+column(55,125)+column(130,150)+column(230,150)+column(305,125)+rect(100,65,160,9,'wall')+rect(90,56,180,9,'trim');let celestial=scene===1?circle(277,65,24,'sun')+[[55,49],[100,85],[145,42],[197,91],[233,32],[318,110]].map(([x,y])=>path(`M${x} ${y-5}l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5Z`,'star')).join(''):`<g id="rays">${Array.from({length:12},(_,i)=>`<g transform="rotate(${i*30} 277 65)">${path('M273 36L277 24L281 36Z','sun')}</g>`).join('')}</g>${circle(277,65,25,'sun')}`;let vegetation=scene===1?'':tree(48,269,.85)+tree(308,282,.9),flowers=scene===1?'':[[40,320],[68,350],[112,351],[270,340],[313,324],[316,355],[228,350]].map(p=>flower(...p)).join('');svg.innerHTML=`<defs><clipPath id="inside"><rect x="17" y="17" width="326" height="356"/></clipPath></defs><rect x="5" y="5" width="350" height="380" rx="3" fill="${paper}" stroke="#b59b69" stroke-width="2"/><g clip-path="url(#inside)" stroke="#786b59" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">${rect(17,17,326,356,'sky')}${celestial}<g id="cloud">${path('M35 72Q47 57 63 67Q79 46 94 67Q110 64 118 80H35Z','cloud')}</g>${bg}${scene!==1?path('M17 330Q100 285 177 324T343 310V373H17Z','ground'):''}${vegetation}<g transform="${scene>=2?'translate(20 130) scale(.9)':'translate(0 100)'}">${horse()}<g pointer-events="none" fill="none" stroke="#a6aaa1"><g class="bree
